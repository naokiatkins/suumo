# Nightly SUUMO searches. Results go to data/<type>/<ward>/<UTC timestamp>.csv, one file per search.
#
# wards:   the part after sc_ in SUUMO's URL, e.g. suumo.jp/chintai/tokyo/sc_setagaya/ -> setagaya
# filters: applied by SUUMO, so all scraped pages are matches. SUUMO only accepts its own dropdown
#          values (anything else silently returns nothing), so the scraper rejects other values.
#          Changing filters changes which listings are seen, so the next run marks some as new.

pages: 3  # per search, newest first; about 20 buildings or houses per page

searches:

  chintai:  # rent
    wards: [setagaya, shibuya, koto, edogawa, kita, suginami]
    filters:
      # min_rent: 10    # 万円: 3.0 to 20.0 in steps of 0.5, then 21-30, 35, 40, 50, 100
      max_rent: 16    # 万円: same values as min_rent
      min_area: 40    # m2: 20 to 70 in steps of 5, then 80, 90, 100
      # max_area: 80    # m2: same values as min_area
      max_walk: 15    # minutes to station: 1, 5, 7, 10, 15, 20
      # max_age: 20     # years: 0 (new), 1, 3, 5, 7, 10, 15, 20, 25, 30
      south_facing: true  # south, south-east or south-west
      reinforced_concrete: true  # 鉄筋系: RC and SRC buildings

  ikkodate:  # new houses for sale
    wards: [setagaya, shibuya]
    filters:
      min_price: 4000           # 万円: 500 to 8000 in steps of 500, then 9000, 10000
      max_price: 8000          # 万円: 500 to 8000 in steps of 500, then 9000, 10000, 12000
      # min_building_area: 50     # m2: 60 to 150 in steps of 10
      # max_building_area: 150    # m2: same values as min_building_area
      # min_land_area: 60         # m2: 60 to 150 in steps of 10
      # max_land_area: 150        # m2: same values as min_land_area
      max_walk: 15              # minutes to station: 1, 3, 5, 7, 10, 15, 20
      south_facing: true        # listings the agency tagged 南向き (south-facing)

  chukoikkodate:  # used houses for sale
    wards: [setagaya, shibuya]
    filters:
      min_price: 4000           # 万円: 500 to 8000 in steps of 500, then 9000, 10000
      max_price: 8000          # 万円: 500 to 8000 in steps of 500, then 9000, 10000, 12000
      # min_building_area: 60     # m2: 60 to 150 in steps of 10
      # max_building_area: 150    # m2: same values as min_building_area
      # min_land_area: 60         # m2: 60 to 150 in steps of 10
      # max_land_area: 150        # m2: same values as min_land_area
      max_walk: 15              # minutes to station: 1, 3, 5, 7, 10, 15, 20
      south_facing: true        # listings the agency tagged 南向き (south-facing)
      # SUUMO has no building structure filter for houses

# Searches copied from SUUMO's own search page: set the filters there, then paste the results page URL.
# Results are split into ward folders by each listing's address (outside the 23 wards -> other/).
# Rent and houses (新築・中古一戸建て) are supported. The sort is replaced with newest first.
# pages is shared by every ward in the URL, so a busy ward can crowd out a quiet one: raise it if needed.
custom:
  - url: https://suumo.jp/jj/chintai/ichiran/FR301FC001/?ar=030&bs=040&pc=30&smk=&po1=25&po2=99&sd=1&kz=1&kz=2&shkr1=03&shkr2=03&shkr3=03&shkr4=03&sc=13109&sc=13110&sc=13112&sc=13113&sc=13114&sc=13115&ta=13&cb=0.0&ct=15.0&ts=1&et=10&mb=40&mt=9999999&cn=15&fw2=
    pages: 15  # about 50 rooms per page; this search had 720 matches
